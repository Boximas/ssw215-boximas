<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charles Avery | Portfolio</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a href="#projects">Projects</a>
        <a href="https://github.com/Boximas" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>

      <section class="hero panel" aria-labelledby="page-title">
        <div class="hero-content">
          <img
            class="avatar"
            src="./assets/avatar.jpg"
            width="180"
            height="180"
            alt="Charles Avery portrait"
          />

          <div class="hero-copy">
            <h1 id="page-title">Charles Avery</h1>
            <p class="subtitle">Student as Stevens Institute of Technology.</p>
            <p class="bio">
              Software Engineering student at Stevens Institute of Technology.
              Likes Software Engineering, Metal Music, History and more.
            </p>
            <a class="button" href="#projects">See my projects</a>
          </div>
        </div>
      </section>
    </header>

    <main>
      <section class="projects panel" id="projects" aria-labelledby="projects-heading">
        <h2 id="projects-heading">Projects</h2>
        <div class="card-list">
          <article class="card">
            <p>Infinite version of the web game Chronogram.</p>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer panel">
      <a href="https://github.com/Boximas" target="_blank" rel="noopener noreferrer">GitHub</a>
    </footer>
  </body>
</html>
